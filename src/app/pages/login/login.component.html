<div class="login-page">
  <div class="login-bg"></div>

  <div class="login-card">
    <div class="login-brand">✂️</div>
    <h1 class="login-title">El Corte</h1>
    <p class="login-subtitle">Panel de administración</p>

    @if (error) {
      <div class="alert alert-danger mb-4 rounded-3">{{ error }}</div>
    }

    <div class="mb-3">
      <label class="form-label">Usuario</label>
      <input type="text" class="form-control form-dark" [(ngModel)]="form.username"
             placeholder="admin" (keydown)="onKey($event)" autocomplete="username">
    </div>
    <div class="mb-4">
      <label class="form-label">Contraseña</label>
      <input type="password" class="form-control form-dark" [(ngModel)]="form.password"
             placeholder="••••••••" (keydown)="onKey($event)" autocomplete="current-password">
    </div>

    <button class="login-btn" (click)="submit()" [disabled]="loading">
      {{ loading ? 'Ingresando...' : 'Ingresar' }}
    </button>

    <a routerlink="/" class="login-back" href="/">← Volver al sitio</a>
  </div>
</div>
