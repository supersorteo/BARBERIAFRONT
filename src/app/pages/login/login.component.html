<div class="login-page">
  <div class="login-bg"></div>

  <div class="login-card">
    <div class="login-brand">✂️</div>
    <h1 class="login-title">{{ nombreNegocio }}</h1>
    <p class="login-subtitle">Panel de administración</p>

    @if (error) {
      <div class="alert alert-danger mb-4 rounded-3">{{ error }}</div>
    }

    <div class="mb-3">
      <label class="form-label">Usuario</label>
      <input type="text" class="form-control form-dark" [(ngModel)]="form.username"
             placeholder="admin" (keydown)="onKey($event)" autocomplete="username">
    </div>
    <div class="mb-4">
      <label class="form-label">Contraseña</label>
      <div class="pass-wrap">
        <input [type]="showPass ? 'text' : 'password'" class="form-control form-dark" [(ngModel)]="form.password"
               placeholder="••••••••" (keydown)="onKey($event)" autocomplete="current-password">
        <button type="button" class="pass-eye" (click)="showPass = !showPass" tabindex="-1">
          @if (showPass) {
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          } @else {
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          }
        </button>
      </div>
    </div>

    <button class="login-btn" (click)="submit()" [disabled]="loading">
      {{ loading ? 'Ingresando...' : 'Ingresar' }}
    </button>

    <a routerlink="/" class="login-back" href="/">← Volver al sitio</a>
  </div>
</div>
