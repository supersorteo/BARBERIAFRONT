<div class="chat-widget">
  @if (abierto) {
    <div class="chat-window">
      <div class="chat-header">
        <div class="chat-header-info">
          <div class="chat-avatar">✂️</div>
          <div class="chat-header-text">
            <span class="chat-header-name">El Corte · Asistente</span>
            <span class="chat-header-status">En línea</span>
          </div>
        </div>
        <button class="btn-close-chat" (click)="toggle()">✕</button>
      </div>

      <div class="chat-messages">
        @for (msg of mensajes; track $index) {
          <div class="msg" [class.user]="msg.rol==='user'" [class.bot]="msg.rol==='bot'">
            <p style="white-space:pre-line;margin:0">{{ msg.texto }}</p>
            <span class="hora">{{ msg.hora }}</span>
          </div>
        }
        @if (escribiendo) {
          <div class="typing"><span></span><span></span><span></span></div>
        }
      </div>

      <div class="chat-input">
        <textarea [(ngModel)]="inputTexto" (keydown)="onKey($event)" placeholder="Escribí tu consulta..." rows="1"></textarea>
        <button class="chat-send-btn" (click)="enviar()" [disabled]="escribiendo">
          <svg viewBox="0 0 24 24" fill="currentColor" width="17" height="17"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  }

  <button class="chat-btn" (click)="toggle()" [class.active]="abierto" title="Hablar con nuestro asistente">
    @if (!abierto) {
      <svg viewBox="0 0 24 24" fill="currentColor" width="26" height="26">
        <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/>
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22">
        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
      </svg>
    }
  </button>
</div>
