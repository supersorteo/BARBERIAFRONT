<div class="chat-widget" [class.chat-widget--elevated]="elevarFab">
  @if (abierto) {
    <div class="chat-window">

      <!-- ── HEADER ── -->
      <div class="chat-header">
        <div class="chat-header-info">
          <div class="chat-avatar">
            <img src="/icons/pelusin-avatar-optimizado.webp" class="pelusin-avatar-img" alt="Pelusín">
          </div>
          <div class="chat-header-text">
            <div class="chat-header-row">
              <span class="chat-header-name">Pelusín</span>
              <span class="chat-header-badge">IA</span>
            </div>
            <span class="chat-header-status">En línea · Asistente de {{ nombreNegocio || 'la barbería' }}</span>
          </div>
        </div>
        <button class="btn-close-chat" (click)="toggle()" title="Cerrar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" width="14" height="14">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- ── MESSAGES ── -->
      <div class="chat-messages" #mensajesEl>
        @for (msg of mensajes; track $index) {
          <div class="msg" [class.user]="msg.rol==='user'" [class.bot]="msg.rol==='bot'">
            @if (msg.rol === 'bot') {
              <div class="bot-msg-icon">
                <img src="/icons/pelusin-avatar-optimizado.webp" class="pelusin-mini-img" alt="">
              </div>
            }
            <p style="white-space:pre-line;margin:0">{{ msg.texto }}</p>
            <span class="hora">{{ msg.hora }}</span>
          </div>
        }
        @if (escribiendo) {
          <div class="typing">
            <span></span><span></span><span></span>
          </div>
        }
      </div>

      <!-- ── INPUT ── -->
      <div class="chat-input">
        <textarea [(ngModel)]="inputTexto" (keydown)="onKey($event)"
                  placeholder="Escribí tu consulta..." rows="1"></textarea>
        <button class="chat-send-btn" (click)="enviar()" [disabled]="escribiendo" title="Enviar">
          <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
            <path d="M2 21l21-9L2 3v7l15 2-15 2z"/>
          </svg>
        </button>
      </div>

    </div>
  }

  <!-- ── FAB ── -->
  <div class="chat-fab">
    @if (!abierto) {
      <div class="fab-label">
        <span>Pelusín</span>
        <div class="fab-label-tip"></div>
      </div>
    }
    <button class="chat-btn" (click)="toggle()" [class.active]="abierto" title="Hablar con Pelusín">
      @if (!abierto) {
        <img src="/icons/pelusin-fab-primer-plano.png" class="pelusin-fab-img" alt="Pelusín">
      } @else {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" width="20" height="20">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      }
    </button>
  </div>
</div>
