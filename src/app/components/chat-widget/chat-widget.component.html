<div class="chat-widget">
  @if (abierto) {
    <div class="chat-window">

      <!-- ── HEADER ── -->
      <div class="chat-header">
        <div class="chat-header-info">
          <div class="chat-avatar">
            <svg class="scissors-avatar" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
              <g class="blade-a">
                <circle cx="8" cy="9" r="4.5" stroke="currentColor" stroke-width="2"/>
                <line x1="11.5" y1="11" x2="32" y2="30" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
              </g>
              <g class="blade-b">
                <circle cx="8" cy="31" r="4.5" stroke="currentColor" stroke-width="2"/>
                <line x1="11.5" y1="29" x2="32" y2="10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
              </g>
              <circle cx="21" cy="20" r="2" fill="currentColor"/>
            </svg>
          </div>
          <div class="chat-header-text">
            <div class="chat-header-row">
              <span class="chat-header-name">Pelusín</span>
              <span class="chat-header-badge">IA</span>
            </div>
            <span class="chat-header-status">En línea · Asistente de El Corte</span>
          </div>
        </div>
        <button class="btn-close-chat" (click)="toggle()" title="Cerrar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" width="14" height="14">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- ── MESSAGES ── -->
      <div class="chat-messages" #mensajesEl>
        @for (msg of mensajes; track $index) {
          <div class="msg" [class.user]="msg.rol==='user'" [class.bot]="msg.rol==='bot'">
            @if (msg.rol === 'bot') {
              <div class="bot-msg-icon">
                <svg viewBox="0 0 24 24" fill="none" width="11" height="11">
                  <circle cx="4" cy="5" r="2.5" stroke="currentColor" stroke-width="1.5"/>
                  <circle cx="4" cy="19" r="2.5" stroke="currentColor" stroke-width="1.5"/>
                  <line x1="6" y1="6.2" x2="20" y2="18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                  <line x1="6" y1="17.8" x2="20" y2="6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
              </div>
            }
            <p style="white-space:pre-line;margin:0">{{ msg.texto }}</p>
            <span class="hora">{{ msg.hora }}</span>
          </div>
        }
        @if (escribiendo) {
          <div class="typing">
            <span></span><span></span><span></span>
          </div>
        }
      </div>

      <!-- ── INPUT ── -->
      <div class="chat-input">
        <textarea [(ngModel)]="inputTexto" (keydown)="onKey($event)"
                  placeholder="Escribí tu consulta..." rows="1"></textarea>
        <button class="chat-send-btn" (click)="enviar()" [disabled]="escribiendo" title="Enviar">
          <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
            <path d="M2 21l21-9L2 3v7l15 2-15 2z"/>
          </svg>
        </button>
      </div>

    </div>
  }

  <!-- ── FAB ── -->
  <div class="chat-fab">
    @if (!abierto) {
      <div class="fab-label">
        <span>Pelusín</span>
        <div class="fab-label-tip"></div>
      </div>
    }
    <button class="chat-btn" (click)="toggle()" [class.active]="abierto" title="Hablar con Pelusín">
      @if (!abierto) {
        <svg class="scissors-fab" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g class="fab-blade-a">
            <circle cx="6.5" cy="7.5" r="4" stroke="currentColor" stroke-width="2"/>
            <line x1="9.5" y1="9.5" x2="27" y2="25.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </g>
          <g class="fab-blade-b">
            <circle cx="6.5" cy="24.5" r="4" stroke="currentColor" stroke-width="2"/>
            <line x1="9.5" y1="22.5" x2="27" y2="6.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </g>
          <circle cx="18" cy="16" r="1.8" fill="currentColor"/>
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" width="20" height="20">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      }
    </button>
  </div>
</div>
