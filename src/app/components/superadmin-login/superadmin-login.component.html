<div class="sa-overlay" (click)="onBackdropClick($event)">
  <div class="sa-modal" role="dialog" aria-modal="true" aria-labelledby="sa-title">

    <!-- Header -->
    <div class="sa-header">
      <div class="sa-header-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <div class="sa-header-text">
        <div class="sa-title" id="sa-title">Acceso restringido</div>
        <div class="sa-subtitle">Panel de administración del sistema</div>
      </div>
      <button class="sa-close" type="button" (click)="cerrar.emit()" aria-label="Cerrar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <!-- Body -->
    <div class="sa-body">

      <div class="sa-field">
        <label for="sa-user">Usuario</label>
        <div class="sa-input-row">
          <span class="sa-input-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"/></svg>
          </span>
          <input id="sa-user" type="text" [(ngModel)]="form.username"
            (keydown)="onKey($event)" autocomplete="username" placeholder="Nombre de usuario" />
        </div>
      </div>

      <div class="sa-field">
        <label for="sa-pass">Contraseña</label>
        <div class="sa-input-row">
          <span class="sa-input-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <input id="sa-pass" [type]="showPass ? 'text' : 'password'"
            [(ngModel)]="form.password" (keydown)="onKey($event)"
            autocomplete="current-password" placeholder="••••••••" />
          <button class="sa-toggle-pass" type="button" (click)="showPass = !showPass"
            [attr.aria-label]="showPass ? 'Ocultar' : 'Mostrar'">
            @if (!showPass) {
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            } @else {
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            }
          </button>
        </div>
      </div>

      @if (error) {
        <div class="sa-error" role="alert">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          {{ error }}
        </div>
      }

      <button class="sa-btn" type="button" (click)="submit()" [disabled]="loading">
        @if (!loading) {
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          <span>Ingresar al sistema</span>
        }
        @if (loading) { <span class="sa-spinner"></span> }
      </button>

      <p class="sa-hint">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Acceso exclusivo para super administradores
      </p>

    </div>
  </div>
</div>
